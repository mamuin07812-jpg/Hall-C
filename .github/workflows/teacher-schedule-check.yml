name: Teacher schedule notification integration check

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/admin_page.dart'
      - 'lib/preparations_page.dart'
      - 'lib/home_page.dart'
      - 'lib/schedule_page.dart'
      - 'pubspec.yaml'
      - '.github/workflows/teacher-schedule-check.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: node --check functions/index.js
      - run: npm ci --prefix functions
      - run: npm --prefix functions run lint
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/admin_page.dart lib/preparations_page.dart lib/home_page.dart lib/schedule_page.dart
